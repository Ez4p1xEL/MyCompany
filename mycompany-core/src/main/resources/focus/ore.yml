id: ore
label: Ore
description:
  - 'Focus on mining ore'
  - 'Four branches: ore yield, field smelting, mining rhythm and company profit.'
condition:
  company_money: 60000

# Ore focus tree - 16 expertises.
# All nodes use value_type: boolean.
#
# CONDITIONS
#   company_money: <number>                 Company cash, consumed when unlocking.
#   expertise: <id>                         One prerequisite must be unlocked.
#   expertises:                             Several entries are AND;
#     - '<id>,<id>'                         ids on one line are OR.
#     - <id>
#   company_log:                            Company counters (logs.yml).
#     - 'block_break_count,<MATERIAL>,<n>'  e.g. 300 coal ore breaks.
#     IMPORTANT: the counter key is block_break_count_<MATERIAL>, so a
#     DEEPSLATE_COAL_ORE break does NOT count towards COAL_ORE. Every line in
#     one company_log block is AND-ed, so pick the material you actually mine.
#
# EFFECTS
#   block_drops_add:
#     <BLOCK|ALL>:
#       - '<ITEM|ALL>,<+N|*N>,<chance>'     drops of that BLOCK, e.g. 'RAW_IRON,+1,25'
#   ore_smelt:                              needs config.yml reference.ore-to-smelted
#     <BLOCK|ALL>:
#       - '<chance>'                         raw ore drop -> ingot
#   mining_haste:
#     <BLOCK|ALL>:
#       - '<amplifier>,<duration_ticks>,<chance>'   amplifier is 0-based, 20 ticks = 1s
#   item_durability_save:
#     <ITEM|item-type|ALL>:                 item-type keys live in config.yml reference.item-type
#       - '<percentage 0.0-1.0>,<chance>'
#     NOTE: the listener does floor(damage * (1 - percentage)) on integer damage,
#     so anything below 1.0 still ends up as 0. Always keep percentage at 1.0 and
#     express the strength through <chance> ("no durability loss").
#
# ACTIONS
#   console_command: [ ... ]                %player% expands to every employee.
#   disable_expertise: [ ... ]              Disable nodes when this one is learned.
#   enable_expertise: [ ... ]               Re-enable nodes when this one is learned.
#   set_price_group: <group>                Internal store price group (prices.yml).

expertise:

  # ------------------------------------------------------------- common ore yield

  coal_seam_1:
    label: 'Rich Coal Seams I'
    description:
      - '&7Coal ore drops: &a30% &7chance of &a+1 coal&7.'
      - '&7Unlock bonus: &a$500 &7to every employee.'
    value_type: boolean
    default:
      value: 'false'
    action:
      console_command:
        - 'eco give %player% 500'
    condition:
      company_money: 15000
    effect:
      block_drops_add:
        COAL_ORE:
          - 'COAL,+1,30'
        DEEPSLATE_COAL_ORE:
          - 'COAL,+1,30'

  coal_seam_2:
    label: 'Rich Coal Seams II'
    description:
      - '&7Coal ore drops: &a20% &7chance of &a+1 coal&7.'
      - '&7Stacks with Rich Coal Seams I.'
    value_type: boolean
    default:
      value: 'false'
    condition:
      expertise: coal_seam_1
      company_money: 30000
    effect:
      block_drops_add:
        COAL_ORE:
          - 'COAL,+1,20'
        DEEPSLATE_COAL_ORE:
          - 'COAL,+1,20'

  copper_vein:
    label: 'Copper Vein'
    description:
      - '&7Copper ore drops: &a30% &7chance of &a+1 raw copper&7.'
      - '&7Deepslate variants included.'
    value_type: boolean
    default:
      value: 'false'
    condition:
      expertise: coal_seam_1
      company_money: 25000
    effect:
      block_drops_add:
        COPPER_ORE:
          - 'RAW_COPPER,+1,30'
        DEEPSLATE_COPPER_ORE:
          - 'RAW_COPPER,+1,30'

  iron_vein:
    label: 'Iron Vein'
    description:
      - '&7Iron ore drops: &a25% &7chance of &a+1 raw iron&7.'
      - '&7Deepslate variants included.'
    value_type: boolean
    default:
      value: 'false'
    condition:
      expertise: coal_seam_2
      company_money: 35000
    effect:
      block_drops_add:
        IRON_ORE:
          - 'RAW_IRON,+1,25'
        DEEPSLATE_IRON_ORE:
          - 'RAW_IRON,+1,25'

  ore_luck:
    label: "Miner's Eye"
    description:
      - '&7Every drop of a common ore: &a10% &7chance of &a+1&7.'
      - '&7Covers coal, copper, iron and gold ore.'
      - '&7Requires 500 stone blocks broken.'
    value_type: boolean
    default:
      value: 'false'
    condition:
      expertise: iron_vein
      company_log:
        - 'block_break_count,STONE,500'
      company_money: 50000
    effect:
      block_drops_add:
        COAL_ORE:
          - 'ALL,+1,10'
        DEEPSLATE_COAL_ORE:
          - 'ALL,+1,10'
        COPPER_ORE:
          - 'ALL,+1,10'
        DEEPSLATE_COPPER_ORE:
          - 'ALL,+1,10'
        IRON_ORE:
          - 'ALL,+1,10'
        DEEPSLATE_IRON_ORE:
          - 'ALL,+1,10'
        GOLD_ORE:
          - 'ALL,+1,10'
        DEEPSLATE_GOLD_ORE:
          - 'ALL,+1,10'

  # --------------------------------------------------------------- field smelting

  field_smelt_1:
    label: 'Field Smelter I'
    description:
      - '&7Iron, gold and copper ore: &a15% &7chance to drop the &aingot &7instead of raw ore.'
      - '&7Saves the fuel and the trip home.'
    value_type: boolean
    default:
      value: 'false'
    condition:
      company_money: 40000
    effect:
      ore_smelt:
        IRON_ORE:
          - '15'
        DEEPSLATE_IRON_ORE:
          - '15'
        GOLD_ORE:
          - '15'
        DEEPSLATE_GOLD_ORE:
          - '15'
        COPPER_ORE:
          - '15'
        DEEPSLATE_COPPER_ORE:
          - '15'

  field_smelt_2:
    label: 'Field Smelter II'
    description:
      - '&7Iron, gold and copper ore: &a25% &7chance to drop the &aingot&7.'
      - '&7Stacks with Field Smelter I.'
    value_type: boolean
    default:
      value: 'false'
    condition:
      expertise: field_smelt_1
      company_money: 60000
    effect:
      ore_smelt:
        IRON_ORE:
          - '25'
        DEEPSLATE_IRON_ORE:
          - '25'
        GOLD_ORE:
          - '25'
        DEEPSLATE_GOLD_ORE:
          - '25'
        COPPER_ORE:
          - '25'
        DEEPSLATE_COPPER_ORE:
          - '25'

  noble_smelt:
    label: 'Noble Smelting'
    description:
      - '&7Gold ore: &a45% &7chance to drop the &agold ingot&7.'
      - '&7Gold is worth the most per block, so the odds are the best.'
    value_type: boolean
    default:
      value: 'false'
    condition:
      expertise: field_smelt_1
      company_money: 70000
    effect:
      ore_smelt:
        GOLD_ORE:
          - '45'
        DEEPSLATE_GOLD_ORE:
          - '45'

  smelt_master:
    label: 'Master Smelter'
    description:
      - '&7Every raw ore drop: &a60% &7chance to drop the &aingot&7.'
      - '&7Requires 1500 stone blocks broken.'
    value_type: boolean
    default:
      value: 'false'
    condition:
      expertise: field_smelt_2
      company_log:
        - 'block_break_count,STONE,1500'
      company_money: 85000
    effect:
      ore_smelt:
        ALL:
          - '60'

  # ------------------------------------------------------- rhythm and tool upkeep

  miner_rhythm_1:
    label: "Miner's Rhythm I"
    description:
      - '&7On any block break: &a25% &7chance of &aHaste I &7for &a5s&7.'
    value_type: boolean
    default:
      value: 'false'
    condition:
      company_money: 20000
    effect:
      mining_haste:
        ALL:
          - '0,100,25'

  miner_rhythm_2:
    label: "Miner's Rhythm II"
    description:
      - '&7On any block break: &a25% &7chance of &aHaste II &7for &a10s&7.'
      - '&7Works with Miners Rhythm I - Haste II outranks it, lower procs are absorbed.'
    value_type: boolean
    default:
      value: 'false'
    condition:
      expertise: miner_rhythm_1
      company_money: 45000
    effect:
      mining_haste:
        ALL:
          - '1,200,25'

  tool_guard_1:
    label: 'Tool Guard I'
    description:
      - '&7Pickaxes: &a20% &7chance to take &ano durability damage&7.'
    value_type: boolean
    default:
      value: 'false'
    condition:
      company_money: 30000
    effect:
      item_durability_save:
        pickaxe:
          - '1.0,20'

  tool_guard_2:
    label: 'Tool Guard II'
    description:
      - '&7Pickaxes: &a30% &7chance to take &ano durability damage&7.'
      - '&7Stacks with Tool Guard I.'
    value_type: boolean
    default:
      value: 'false'
    condition:
      expertise: tool_guard_1
      company_money: 55000
    effect:
      item_durability_save:
        pickaxe:
          - '1.0,30'

  # ----------------------------------------------------------------- company profit

  ore_trader:
    label: 'Ore Trader'
    description:
      - '&7Internal store buys ore products at the &aore-company &7rate.'
      - '&7That is &a+30% &7compared to the normal rate.'
    value_type: boolean
    default:
      value: 'false'
    action:
      set_price_group: ore-company
    condition:
      company_money: 80000

  ore_magnate:
    label: 'Ore Magnate'
    description:
      - '&7Unlock bonus: &a$2,500 &7to every employee.'
      - '&7Requires 300 coal ore breaks.'
    value_type: boolean
    default:
      value: 'false'
    action:
      console_command:
        - 'eco give %player% 2500'
    condition:
      expertise: ore_trader
      company_log:
        - 'block_break_count,COAL_ORE,300'
      company_money: 100000

  # -------------------------------------------------------------------- capstone

  mining_legend:
    label: 'Mining Legend'
    description:
      - '&7Common ore drops: &a20% &7chance of &a+1&7.'
      - '&7Raw ore drops: &a30% &7chance to drop the &aingot&7.'
      - '&7Requires Master Smelter, Miners Rhythm II, Tool Guard II and Ore Magnate.'
      - '&7Unlock bonus: &a$10,000 &7to every employee.'
    value_type: boolean
    default:
      value: 'false'
    action:
      console_command:
        - 'eco give %player% 10000'
    condition:
      expertises:
        - smelt_master
        - miner_rhythm_2
        - tool_guard_2
        - ore_magnate
      company_log:
        - 'block_break_count,DIAMOND_ORE,100'
      company_money: 150000
    effect:
      block_drops_add:
        COAL_ORE:
          - 'ALL,+1,20'
        DEEPSLATE_COAL_ORE:
          - 'ALL,+1,20'
        COPPER_ORE:
          - 'ALL,+1,20'
        DEEPSLATE_COPPER_ORE:
          - 'ALL,+1,20'
        IRON_ORE:
          - 'ALL,+1,20'
        DEEPSLATE_IRON_ORE:
          - 'ALL,+1,20'
        GOLD_ORE:
          - 'ALL,+1,20'
        DEEPSLATE_GOLD_ORE:
          - 'ALL,+1,20'
        DIAMOND_ORE:
          - 'ALL,+1,20'
        DEEPSLATE_DIAMOND_ORE:
          - 'ALL,+1,20'
      ore_smelt:
        ALL:
          - '30'
