size: 45

options:
  # You need to make sure that the player-per-page is less than the number of slots available for players, otherwise it will not work properly.
  player-per-page: 10

items:
  # default for all empty slots
  default:
    material: BLACK_STAINED_GLASS_PANE

  company_info:
    material: DIAMOND
    slot: 4

  player:
    # If you write %PLAYER% in the material, it will automatically replace it with the player's head.
    material: PLAYER_HEAD;%PLAYER%
    slot: 20

  back_to_main:
    material: NETHER_STAR
    slot: 36

  previous_page:
    material: RED_STAINED_GLASS_PANE
    slot: 39

  next_page:
    material: LIME_STAINED_GLASS_PANE
    slot: 41



