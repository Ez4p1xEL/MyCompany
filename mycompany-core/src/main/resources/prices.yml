# This file contains the price information for products
# 商品定价的文件

multipliers:
  # 公司内部回收价应比公共回收商店更高
  # The internal company recycling price should be higher than the public recycling store
  company:
    normal: 1.2
    ore-company: 1.3

# 在公司内部回收时，玩家的分成比例
# When recycling within the company, the player's share ratio
player-share: 0.1

# 以下为标准价格，你应该填写为你服务器公共回收商店的价格
# The following are standard prices, you should fill in the prices for your server's public recycling store
prices:
  vanilla:
    ore1:
      material: iron_ingot
      price: 10
      group: ore-company
    ore2:
      material: diamond
      price: 100
      group: ore-company

